# DLP-Affinity 组合校验→训练→预测 串联 WorkflowTemplate
# 注册：./argo/dlp-affinity-template.create.sh train_predict
# 投递：./argo/dlp-affinity-train_predict.submit.sh
#
# 文件类入口：single-mutant-path / train-path / wt-path / output-dir；可选 val-path（空则回落 train-path）
# 派生布局：
#   output-dir/train/   ← 训练产物（exp-name=train）
#   output-dir/combo/   ← 多突变组合与校验中间件
#   output-dir/predict/ ← 预测结果
#
# DAG：build-combinations → train → predict
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dlp-affinity-train-predict
  namespace: default
  labels:
    app: dlp-affinity
    component: train-predict
spec:
  entrypoint: main
  activeDeadlineSeconds: 108000
  ttlStrategy:
    secondsAfterCompletion: 2592000
    secondsAfterSuccess: 2592000
    secondsAfterFailure: 2592000
  arguments:
    parameters:
      - name: nas-mount-path
        value: /mnt
      - name: image
        value: beijing-acr-cr-registry-vpc.cn-beijing.cr.aliyuncs.com/biocloud/enzyme_dev:DLP_Affinity.v1.0.0
      # --- 文件入口（仅此四项）---
      - name: single-mutant-path
        value: /mnt/nas1/liubo/project/DLP_Affinity/release_package/data/7KMG/LY-CoV555_DMS_train_model_input.csv
      - name: train-path
        value: /mnt/nas1/liubo/project/DLP_Affinity/release_package/data/7KMG/LY-CoV555_DMS_train_model_input.csv
      # 可选；空字符串时 DAG 传入 train 时回落为 train-path（保证写出 best_model.pt）
      - name: val-path
        value: ""
      - name: wt-path
        value: ""
      - name: output-dir
        value: /mnt/nas1/liubo/project/DLP_Affinity/outputs
      # --- 运行/算法参数（非路径）---
      - name: num-epochs
        value: "50"
      - name: seed
        value: "42"
      - name: device
        value: cuda
      - name: freeze-esm
        value: "true"
      - name: use-small
        value: "false"
      - name: gpu-model-series
        value: A10
      - name: label-col
        value: kd
      - name: better-direction
        value: lower
      - name: top-n-singles
        value: "20"
      - name: min-order
        value: "2"
      - name: max-order
        value: "5"
      - name: max-combinations
        value: "50000"
      - name: batch-size
        value: "8"
      # templateRef 子模板可选路径占位（空=未使用；避免残留 {{workflow.parameters.*}}）
      - name: esm-checkpoint
        value: ""
      - name: config-path
        value: ""
  volumes:
    - name: nas-data
      persistentVolumeClaim:
        claimName: pvc-nas
  templates:
    - name: main
      dag:
        tasks:
          - name: build-combinations
            template: build-combinations
            arguments:
              parameters:
                - name: single-mutant-path
                  value: "{{workflow.parameters.single-mutant-path}}"
                - name: train-path
                  value: "{{workflow.parameters.train-path}}"
                - name: wt-path
                  value: "{{workflow.parameters.wt-path}}"
                - name: output-dir
                  value: "{{workflow.parameters.output-dir}}"
                - name: label-col
                  value: "{{workflow.parameters.label-col}}"
                - name: better-direction
                  value: "{{workflow.parameters.better-direction}}"
                - name: top-n-singles
                  value: "{{workflow.parameters.top-n-singles}}"
                - name: min-order
                  value: "{{workflow.parameters.min-order}}"
                - name: max-order
                  value: "{{workflow.parameters.max-order}}"
                - name: max-combinations
                  value: "{{workflow.parameters.max-combinations}}"
                - name: seed
                  value: "{{workflow.parameters.seed}}"
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: nas-mount-path
                  value: "{{workflow.parameters.nas-mount-path}}"

          - name: train
            dependencies: [build-combinations]
            templateRef:
              name: dlp-affinity-train
              template: main
            arguments:
              parameters:
                - name: nas-mount-path
                  value: "{{workflow.parameters.nas-mount-path}}"
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: train-path
                  value: "{{workflow.parameters.train-path}}"
                # 未单独提供 val-path 时使用 train-path，避免无验证集不写 best_model.pt
                - name: val-path
                  value: "{{=workflow.parameters['val-path'] != '' ? workflow.parameters['val-path'] : workflow.parameters['train-path']}}"
                - name: esm-model-path
                  value: /mnt/nas1/liubo/models/esm2_t30_150M_UR50D
                - name: esm-checkpoint
                  value: "{{workflow.parameters.esm-checkpoint}}"
                - name: config-path
                  value: "{{workflow.parameters.config-path}}"
                - name: output-dir
                  value: "{{workflow.parameters.output-dir}}"
                - name: work-root
                  value: /mnt/nas1/liubo/project/DLP_Affinity
                - name: exp-name
                  value: train
                - name: num-epochs
                  value: "{{workflow.parameters.num-epochs}}"
                - name: seed
                  value: "{{workflow.parameters.seed}}"
                - name: device
                  value: "{{workflow.parameters.device}}"
                - name: freeze-esm
                  value: "{{workflow.parameters.freeze-esm}}"
                - name: use-small
                  value: "{{workflow.parameters.use-small}}"
                - name: gpu-model-series
                  value: "{{workflow.parameters.gpu-model-series}}"

          - name: predict
            dependencies: [train]
            templateRef:
              name: dlp-affinity-predict
              template: main
            arguments:
              parameters:
                - name: nas-mount-path
                  value: "{{workflow.parameters.nas-mount-path}}"
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: checkpoint
                  value: "{{tasks.train.outputs.parameters.best-model-path}}"
                - name: input-path
                  value: "{{workflow.parameters.output-dir}}/combo/multimutant_predict_input.csv"
                - name: output-path
                  value: "{{workflow.parameters.output-dir}}/predict/predictions.csv"
                - name: work-root
                  value: /mnt/nas1/liubo/project/DLP_Affinity
                - name: batch-size
                  value: "{{workflow.parameters.batch-size}}"
                - name: device
                  value: "{{workflow.parameters.device}}"
                - name: gpu-model-series
                  value: "{{workflow.parameters.gpu-model-series}}"

    - name: build-combinations
      inputs:
        parameters:
          - name: single-mutant-path
          - name: train-path
          - name: wt-path
          - name: output-dir
          - name: label-col
          - name: better-direction
          - name: top-n-singles
          - name: min-order
          - name: max-order
          - name: max-combinations
          - name: seed
          - name: image
          - name: nas-mount-path
      retryStrategy:
        limit: "2"
        retryPolicy: "Always"
        backoff:
          duration: "15s"
          factor: "2"
          maxDuration: "5m"
      activeDeadlineSeconds: 3600
      script:
        image: "{{inputs.parameters.image}}"
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: [bash]
        source: |
          set -euo pipefail

          NAS="{{inputs.parameters.nas-mount-path}}"
          WORK_ROOT="/mnt/nas1/liubo/project/DLP_Affinity"
          OUTPUT_DIR="{{inputs.parameters.output-dir}}"
          SINGLE_PATH="{{inputs.parameters.single-mutant-path}}"
          TRAIN_PATH="{{inputs.parameters.train-path}}"
          WT_PATH="{{inputs.parameters.wt-path}}"
          LABEL_COL="{{inputs.parameters.label-col}}"
          BETTER_DIR="{{inputs.parameters.better-direction}}"

          under_nas() {
            case "$1" in
              "$NAS"|"$NAS"/*) return 0 ;;
              *) echo "路径必须在 NAS 挂载前缀内 ($NAS): $1" >&2; exit 1 ;;
            esac
          }

          under_nas "$WORK_ROOT"
          under_nas "$OUTPUT_DIR"
          under_nas "$SINGLE_PATH"
          under_nas "$TRAIN_PATH"
          [ -n "$WT_PATH" ] && under_nas "$WT_PATH"

          # 固定派生：output-dir/{combo,predict}
          COMBO_DIR="${OUTPUT_DIR}/combo"
          PREDICT_DIR="${OUTPUT_DIR}/predict"
          mkdir -p "${COMBO_DIR}" "${PREDICT_DIR}"
          COMBO_OUT="${COMBO_DIR}/multimutant_predict_input.csv"
          SELECTED_OUT="${COMBO_DIR}/beneficial_singles.csv"
          CONSENSUS_WT_OUT="${COMBO_DIR}/consensus_wildtype.csv"

          LOG_FILE="${COMBO_DIR}/argo_build_combinations.log"
          exec > >(tee -a "${LOG_FILE}") 2>&1
          echo "=== [build-combinations] validate+build start $(date -Iseconds) ==="
          echo "combo_dir=${COMBO_DIR}"
          echo "predict_dir=${PREDICT_DIR}"
          echo "top-n-singles={{inputs.parameters.top-n-singles}}"

          SCRIPT_PY="${WORK_ROOT}/script/build_multimutant_library.py"
          if [ ! -f "${SCRIPT_PY}" ]; then
            echo "ERROR: script not found: ${SCRIPT_PY}" >&2
            exit 1
          fi

          ARGS=(
            --input "${SINGLE_PATH}"
            --output "${COMBO_OUT}"
            --train-path "${TRAIN_PATH}"
            --label-col "${LABEL_COL}"
            --better-direction "${BETTER_DIR}"
            --top-n-singles "{{inputs.parameters.top-n-singles}}"
            --min-order "{{inputs.parameters.min-order}}"
            --max-order "{{inputs.parameters.max-order}}"
            --max-combinations "{{inputs.parameters.max-combinations}}"
            --seed "{{inputs.parameters.seed}}"
            --selected-singles-out "${SELECTED_OUT}"
            --consensus-wt-out "${CONSENSUS_WT_OUT}"
          )
          if [ -n "${WT_PATH}" ]; then
            ARGS+=(--wt-path "${WT_PATH}")
          fi

          echo "python ${SCRIPT_PY} ${ARGS[*]}"
          python "${SCRIPT_PY}" "${ARGS[@]}"

          if [ ! -f "${COMBO_OUT}" ]; then
            echo "ERROR: combo output missing: ${COMBO_OUT}" >&2
            exit 1
          fi
          N_COMBO="$(python -c "import pandas as pd; print(len(pd.read_csv('${COMBO_OUT}')))")"
          if [ "${N_COMBO}" -lt 1 ]; then
            echo "ERROR: combo csv has 0 rows: ${COMBO_OUT}" >&2
            exit 1
          fi
          echo "validation ok: n_combinations=${N_COMBO}"
          echo "=== [build-combinations] done $(date -Iseconds) combo=${COMBO_OUT} ==="
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        volumeMounts:
          - name: nas-data
            mountPath: "{{inputs.parameters.nas-mount-path}}"
