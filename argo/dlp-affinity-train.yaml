# DLP-Affinity 训练微调 WorkflowTemplate
# 注册：./argo/dlp-affinity-template.create.sh train
# 投递：./argo/dlp-affinity-train.submit.sh
#   EXP_NAME=exp001 FREEZE_ESM=true ./argo/dlp-affinity-train.submit.sh
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dlp-affinity-train
  namespace: default
  labels:
    app: dlp-affinity
    component: train
spec:
  # entrypoint 仅作为调度器，业务逻辑在下游 template
  entrypoint: main
  activeDeadlineSeconds: 86400
  ttlStrategy:
    secondsAfterCompletion: 86400
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400
  arguments:
    parameters:
      - name: nas-mount-path
        value: /mnt
      # 镜像走北京 ACR VPC 内网仓库（明确 tag，禁止 latest）
      - name: image
        value: beijing-acr-cr-registry-vpc.cn-beijing.cr.aliyuncs.com/biocloud/enzyme_dev:DLP_Affinity.v1.0.0
      - name: train-path
        value: /mnt/nas1/liubo/project/DLP_Affinity/release_package/data/7KMG/LY-CoV555_DMS_train_model_input.csv
      - name: val-path
        value: /mnt/nas1/liubo/project/DLP_Affinity/release_package/data/7KMG/LY-CoV555_DMS_val_model_input.csv
      # ESM2 基座：本地 HF 目录（优先）或 HF model id
      - name: esm-model-path
        value: /mnt/nas1/liubo/models/esm2_t30_150M_UR50D
      # 可选：已微调 ESM 的 .pt；留空则仅用 esm-model-path 基座
      - name: esm-checkpoint
        value: ""
      - name: output-dir
        value: /mnt/nas1/liubo/project/DLP_Affinity/outputs
      - name: work-root
        value: /mnt/nas1/liubo/project/DLP_Affinity
      - name: exp-name
        value: dlp-affinity-train
      - name: seed
        value: "42"
      - name: device
        value: cuda
      # true: 冻结 ESM2，仅训练 R2R / GSPE / Regression Head
      - name: freeze-esm
        value: "true"
      # true: 使用小模型配置（联调/冒烟）
      - name: use-small
        value: "false"
      - name: config-path
        value: ""
      # 阿里云 ACS GPU 型号（与集群调度标签一致）
      - name: gpu-model-series
        value: A10
  volumes:
    - name: nas-data
      persistentVolumeClaim:
        claimName: pvc-nas
  templates:
    # ---------- 调度层 ----------
    - name: main
      steps:
        - - name: train-finetune
            template: run-train
            arguments:
              parameters:
                - name: nas-mount-path
                  value: "{{workflow.parameters.nas-mount-path}}"
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: train-path
                  value: "{{workflow.parameters.train-path}}"
                - name: val-path
                  value: "{{workflow.parameters.val-path}}"
                - name: esm-model-path
                  value: "{{workflow.parameters.esm-model-path}}"
                - name: esm-checkpoint
                  value: "{{workflow.parameters.esm-checkpoint}}"
                - name: output-dir
                  value: "{{workflow.parameters.output-dir}}"
                - name: work-root
                  value: "{{workflow.parameters.work-root}}"
                - name: exp-name
                  value: "{{workflow.parameters.exp-name}}"
                - name: seed
                  value: "{{workflow.parameters.seed}}"
                - name: device
                  value: "{{workflow.parameters.device}}"
                - name: freeze-esm
                  value: "{{workflow.parameters.freeze-esm}}"
                - name: use-small
                  value: "{{workflow.parameters.use-small}}"
                - name: config-path
                  value: "{{workflow.parameters.config-path}}"
                - name: gpu-model-series
                  value: "{{workflow.parameters.gpu-model-series}}"

    # ---------- 业务层：训练微调 ----------
    # 输入：训练/验证 CSV、可选 ESM checkpoint；输出：best_model 路径与实验目录（写入 NAS）
    - name: run-train
      inputs:
        parameters:
          - name: nas-mount-path
          - name: image
          - name: train-path
          - name: val-path
          - name: esm-model-path
          - name: esm-checkpoint
          - name: output-dir
          - name: work-root
          - name: exp-name
          - name: seed
          - name: device
          - name: freeze-esm
          - name: use-small
          - name: config-path
          - name: gpu-model-series
      outputs:
        parameters:
          - name: best-model-path
            valueFrom:
              path: /tmp/best_model_path.txt
          - name: experiment-dir
            valueFrom:
              path: /tmp/experiment_dir.txt
      retryStrategy:
        limit: "2"
        retryPolicy: "Always"
        backoff:
          duration: "30s"
          factor: "2"
          maxDuration: "10m"
      activeDeadlineSeconds: 86400
      # 阿里云 ACS GPU 调度标签（与 enzyme-aice-mutate 一致）
      metadata:
        labels:
          alibabacloud.com/acs: "true"
          alibabacloud.com/compute-class: "gpu"
          alibabacloud.com/gpu-model-series: "{{inputs.parameters.gpu-model-series}}"
        annotations:
          alibabacloud.com/extra-ephemeral-storage: "80Gi"
      script:
        image: "{{inputs.parameters.image}}"
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: [bash]
        source: |
          set -euo pipefail

          NAS="{{inputs.parameters.nas-mount-path}}"
          TRAIN_PATH="{{inputs.parameters.train-path}}"
          VAL_PATH="{{inputs.parameters.val-path}}"
          OUTPUT_DIR="{{inputs.parameters.output-dir}}"
          WORK_ROOT="{{inputs.parameters.work-root}}"
          EXP_NAME="{{inputs.parameters.exp-name}}"
          ESM_MODEL="{{inputs.parameters.esm-model-path}}"
          ESM_CKPT="{{inputs.parameters.esm-checkpoint}}"
          CONFIG_PATH="{{inputs.parameters.config-path}}"

          under_nas() {
            case "$1" in
              "$NAS"|"$NAS"/*) return 0 ;;
              *) echo "路径必须在 NAS 挂载前缀内 ($NAS): $1" >&2; exit 1 ;;
            esac
          }

          under_nas "$TRAIN_PATH"
          under_nas "$OUTPUT_DIR"
          under_nas "$WORK_ROOT"
          [ -n "$VAL_PATH" ] && under_nas "$VAL_PATH"
          [ -n "$ESM_MODEL" ] && under_nas "$ESM_MODEL"
          [ -n "$ESM_CKPT" ] && under_nas "$ESM_CKPT"
          [ -n "$CONFIG_PATH" ] && under_nas "$CONFIG_PATH"

          export HF_HOME="${WORK_ROOT}/.cache/huggingface"
          export TRANSFORMERS_CACHE="${HF_HOME}"
          export TORCH_HOME="${WORK_ROOT}/.cache/torch"
          export HF_ENDPOINT="${HF_ENDPOINT:-https://hf-mirror.com}"
          EXP_DIR="${OUTPUT_DIR}/${EXP_NAME}"
          mkdir -p "$HF_HOME" "$TORCH_HOME" "$OUTPUT_DIR" "$EXP_DIR"

          # ACS/ECI 上 kubectl logs 常为空，日志落到 NAS 便于排查
          LOG_FILE="${EXP_DIR}/argo_main.log"
          exec > >(tee -a "${LOG_FILE}") 2>&1
          echo "=== [dlp-affinity-train] start $(date -Iseconds) ==="
          echo "log_file=${LOG_FILE}"

          if [ ! -f "${TRAIN_PATH}" ]; then
            echo "ERROR: train data not found: ${TRAIN_PATH}" >&2
            exit 1
          fi
          echo "train columns: $(head -1 "${TRAIN_PATH}")"

          # 优先用 NAS 上的代码（便于 hotfix），否则回退镜像 /app
          if [ -f "${WORK_ROOT}/release_package/train.py" ]; then
            APP_DIR="${WORK_ROOT}/release_package"
          elif [ -f /app/train.py ]; then
            APP_DIR=/app
          else
            echo "ERROR: train.py not found under ${WORK_ROOT}/release_package or /app" >&2
            exit 1
          fi
          cd "${APP_DIR}"
          export PYTHONPATH="${APP_DIR}${PYTHONPATH:+:$PYTHONPATH}"
          echo "app_dir=${APP_DIR}"
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

          # transformers>=4.52 会因要求 torch>=2.4 而禁用镜像中的 torch 2.3.1，需钉兼容版
          if ! python -c "import importlib.metadata as m; assert m.version('transformers')=='4.46.3'"; then
            echo "pinning transformers==4.46.3 accelerate==0.34.2 (compat torch 2.3.1)"
            pip install --no-cache-dir "transformers==4.46.3" "accelerate==0.34.2"
          fi
          python -c "from transformers import AutoModel; import torch; print('transformers+torch ok', torch.__version__)"

          ARGS=(
            --train_path "${TRAIN_PATH}"
            --output_dir "${OUTPUT_DIR}"
            --exp_name "${EXP_NAME}"
            --seed "{{inputs.parameters.seed}}"
            --device "{{inputs.parameters.device}}"
          )

          if [ -n "${VAL_PATH}" ]; then
            if [ ! -f "${VAL_PATH}" ]; then
              echo "ERROR: val data not found: ${VAL_PATH}" >&2
              exit 1
            fi
            ARGS+=(--val_path "${VAL_PATH}")
          fi

          if [ -n "${ESM_MODEL}" ]; then
            if [ ! -d "${ESM_MODEL}" ]; then
              echo "ERROR: esm model directory not found: ${ESM_MODEL}" >&2
              exit 1
            fi
            ARGS+=(--esm_model "${ESM_MODEL}")
            echo "esm_model=${ESM_MODEL}"
          fi

          if [ -n "${ESM_CKPT}" ]; then
            if [ ! -f "${ESM_CKPT}" ]; then
              echo "ERROR: esm checkpoint not found: ${ESM_CKPT}" >&2
              exit 1
            fi
            ARGS+=(--esm_checkpoint "${ESM_CKPT}")
          fi

          if [ -n "${CONFIG_PATH}" ]; then
            if [ ! -f "${CONFIG_PATH}" ]; then
              echo "ERROR: config not found: ${CONFIG_PATH}" >&2
              exit 1
            fi
            ARGS+=(--config "${CONFIG_PATH}")
          fi

          if [ "{{inputs.parameters.freeze-esm}}" = "true" ]; then
            ARGS+=(--freeze_esm)
          fi

          if [ "{{inputs.parameters.use-small}}" = "true" ]; then
            ARGS+=(--use_small)
          fi

          echo "python train.py ${ARGS[*]}"
          python train.py "${ARGS[@]}"

          BEST_MODEL="${EXP_DIR}/best_model.pt"
          if [ ! -f "${BEST_MODEL}" ]; then
            echo "ERROR: best_model.pt not found under ${EXP_DIR}" >&2
            ls -la "${EXP_DIR}" >&2 || true
            exit 1
          fi

          printf '%s' "${BEST_MODEL}" > /tmp/best_model_path.txt
          printf '%s' "${EXP_DIR}" > /tmp/experiment_dir.txt
          echo "=== [dlp-affinity-train] done $(date -Iseconds) best_model=${BEST_MODEL} ==="
        env:
          - name: HF_ENDPOINT
            value: https://hf-mirror.com
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-credentials
                key: HF_TOKEN
                optional: true
        # 资源配额与 enzyme-aice-mutate 对齐（阿里云 ACS GPU Pod）
        resources:
          requests:
            memory: "40Gi"
            cpu: "10"
            nvidia.com/gpu: "1"
          limits:
            memory: "40Gi"
            cpu: "10"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: nas-data
            mountPath: "{{inputs.parameters.nas-mount-path}}"
